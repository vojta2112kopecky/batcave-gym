  <style>
/* ============================================================
   BATCAVE GYM – sleek dark
   Ground: čerň, vrstvy přes průsvitnou bílou, hairline linky.
   Akcent: chladná modrá + fialová. Žádná žlutá.
   ============================================================ */
:root {
  --bg: #000000;
  --s1: rgba(255, 255, 255, .035);   /* karta */
  --s2: rgba(255, 255, 255, .06);    /* vyvýšená plocha */
  --s3: rgba(255, 255, 255, .09);    /* stisk / aktivní */
  --line: rgba(255, 255, 255, .08);
  --line2: rgba(255, 255, 255, .14);
  --text: #f4f6fa;
  --muted: #858d9c;
  --dim: #5b6373;
  --accent: #4c8dff;
  --accent-soft: rgba(76, 141, 255, .16);
  --violet: #8b7cff;
  --ok: #30d158;
  --alert: #ff453a;
  --r-card: 18px;
  --r-btn: 15px;
  --r-sm: 11px;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 40% at 50% -5%, rgba(76, 141, 255, .10), transparent 70%),
    radial-gradient(ellipse 70% 30% at 90% 8%, rgba(139, 124, 255, .06), transparent 70%);
  background-attachment: fixed;
  color: var(--text);
  font-family: Manrope, -apple-system, "SF Pro Text", system-ui, sans-serif;
  font-weight: 500;
  font-feature-settings: "ss01";
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: 86px; }
.screen { flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 0; animation: in .2s cubic-bezier(.32, .72, 0, 1); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* během tréninku se obrazovky nepřesouvají – rychlé proklikání musí sedět na pixel */
.screen.wk { animation: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

svg.ico { width: 22px; height: 22px; display: block; }

/* ---- typografie ---- */
h1.brand { font-size: 27px; font-weight: 800; letter-spacing: -.03em; text-align: center; margin: 10px 0 3px; }
h1.brand em { font-style: normal; color: var(--muted); }
.sub { text-align: center; color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .01em; margin-bottom: 20px; }
h2 {
  font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); margin: 26px 0 10px; display: flex; align-items: center; gap: 7px;
}
h2 svg.ico { width: 14px; height: 14px; }

/* ---- kalendář ---- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  background: var(--s1); border: 1px solid transparent; border-radius: 14px;
  padding: 9px 2px 8px; text-align: center; cursor: pointer;
  transition: background .15s ease;
}
.day:active { background: var(--s3); }
.day .dow { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.day .num { font-size: 16px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.day .tag {
  font-size: 11px; font-weight: 800; height: 20px; line-height: 20px; border-radius: 7px;
  background: var(--s2); color: var(--dim);
}
.day.has .tag { background: var(--accent-soft); color: #a9c8ff; }
.day.done .tag { background: rgba(48, 209, 88, .15); color: var(--ok); }
.day.done .tag svg.ico { width: 13px; height: 13px; margin: 3px auto 0; }
.day.today { background: var(--s2); border-color: var(--accent); }
.day.today .num { color: var(--accent); }
.day.rest .tag { color: #3d434f; }

/* ---- karty ---- */
.card {
  background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 15px 16px; margin-bottom: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  transition: background .15s ease, transform .08s ease;
}
.card:active { background: var(--s2); transform: scale(.99); }
.card .body { flex: 1; min-width: 0; }
.card .title { font-size: 15.5px; font-weight: 800; letter-spacing: -.015em; }
.card .meta { color: var(--muted); font-size: 12.5px; font-weight: 500; margin-top: 3px; line-height: 1.4; }
.card .go { color: var(--dim); flex-shrink: 0; }
.card .go svg.ico { width: 17px; height: 17px; }

/* neklikatelný blok (nastavení) */
.panel {
  background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 15px 16px; margin-bottom: 8px;
}
.panel .title { font-size: 14.5px; font-weight: 800; letter-spacing: -.015em; }
.panel .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

/* stavová tečka místo pruhu u kraje */
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--muted); align-self: flex-start; margin-top: 6px; }
.dot.up { background: var(--ok); box-shadow: 0 0 10px rgba(48, 209, 88, .5); }
.dot.hold { background: var(--accent); box-shadow: 0 0 10px rgba(76, 141, 255, .5); }
.dot.down { background: var(--violet); box-shadow: 0 0 10px rgba(139, 124, 255, .5); }

/* ---- hero ---- */
.hero {
  background: linear-gradient(165deg, rgba(76, 141, 255, .14), var(--s1) 55%);
  border: 1px solid var(--line); border-radius: 22px; padding: 20px 18px; margin-bottom: 10px;
}
.hero .kicker { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.hero .htitle { font-size: 29px; font-weight: 800; letter-spacing: -.035em; margin: 7px 0 4px; }
.hero .hfocus { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; }

/* ---- tlačítka: 3 úrovně důležitosti ---- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  border: none; border-radius: var(--r-btn); font-family: inherit; font-weight: 800;
  letter-spacing: -.01em; cursor: pointer;
  transition: transform .08s ease, filter .12s ease, background .2s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.98); filter: brightness(1.15); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* 1. hlavní akce – jedna na obrazovku */
.btn-primary {
  background: linear-gradient(180deg, #5a97ff, var(--accent));
  color: #fff; font-size: 17px; padding: 18px;
  box-shadow: 0 8px 28px rgba(76, 141, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .22);
}
.btn-huge { font-size: 19px; padding: 22px; }
/* potvrzení – zelené bliknutí */
.btn.ok {
  background: linear-gradient(180deg, #4ade80, var(--ok)) !important;
  box-shadow: 0 8px 34px rgba(48, 209, 88, .45), inset 0 1px 0 rgba(255, 255, 255, .3) !important;
  transform: scale(1.015);
}
/* 2. vedlejší – obrys */
.btn-2 {
  background: transparent; color: var(--text); border: 1px solid var(--line2);
  font-size: 13.5px; font-weight: 700; padding: 13px;
}
/* 3. drobné – jen text */
.btn-3 {
  background: none; color: var(--dim); border: none;
  font-size: 12.5px; font-weight: 600; padding: 11px;
}
.btn-3 svg.ico { width: 15px; height: 15px; }
.btn-3:active { color: var(--muted); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row .btn { flex: 1; }
/* křížek má pořádnou klikací plochu, i když je vizuálně malý */
.back {
  position: absolute; top: -2px; left: -6px; background: none; border: none;
  color: var(--dim); cursor: pointer; opacity: .55;
  width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
  transition: opacity .15s ease;
}
.back:hover { opacity: 1; }
.back:active { opacity: 1; transform: scale(.9); }
.back svg.ico { width: 17px; height: 17px; }
.topbar { position: relative; min-height: 44px; }

/* ---- spodní dok: tlačítka nikdy neposkočí ---- */
.dock {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  max-width: 480px; margin: 0 auto;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 26%);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.dock .spotify { margin: 0; }
.dock-extra { display: flex; gap: 6px; justify-content: center; }
.dock-extra .btn { flex: 1; padding: 9px 4px; }
/* obsah tréninku se vejde nad dok a je vycentrovaný */
#app.in-workout { padding-bottom: 0; }
.screen.wk {
  min-height: 100dvh; display: flex; flex-direction: column; justify-content: flex-start;
  padding: 62px 16px calc(200px + env(safe-area-inset-bottom));
}
/* pevné výšky bloků, ať se při proklikávání nic neposouvá */
.screen.wk .ex-head { min-height: 118px; display: flex; flex-direction: column; justify-content: center; }
.screen.wk .stats { min-height: 104px; }
.screen.wk .timer-wrap { min-height: 152px; display: flex; flex-direction: column; justify-content: center; }
.screen.wk .stepper { min-height: 118px; display: flex; flex-direction: column; justify-content: center; }
.rest-screen .next-wrap { min-height: 118px; }
/* nižší displeje (SE apod.) – ať dok nepřekryje obsah */
@media (max-height: 760px) {
  .screen.wk { padding-top: 54px; padding-bottom: calc(176px + env(safe-area-inset-bottom)); }
  .screen.wk .ex-head { min-height: 96px; }
  .screen.wk .stats { min-height: 92px; }
  .screen.wk .timer-wrap { min-height: 116px; margin: 12px 0 10px; }
  .screen.wk .stepper { min-height: 96px; }
  .rest-screen .next-wrap { min-height: 96px; margin-top: 16px; }
  .timer { font-size: 64px; }
  .stepper .val { font-size: 38px; }
  .step-btn { width: 54px; height: 54px; }
  .rpe-btn { padding: 20px 0; font-size: 21px; }
  .rpe-grid { gap: 9px; margin: 18px 0 14px; }
}
.screen.wk .topbar { position: absolute; top: 8px; left: 16px; right: 16px; }

/* ---- hlavička cviku ---- */
.ex-head { text-align: center; margin: 12px 0 4px; }
.ex-sub { color: var(--dim); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.ex-name { font-size: 21px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0; line-height: 1.18; text-wrap: balance; }
.ex-set { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.ex-set .type { color: var(--dim); }
.ex-target { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* políčka setů */
.setdots { display: flex; justify-content: center; gap: 5px; margin: 12px 0 8px; }
.setdots i {
  width: 30px; height: 16px; border-radius: 6px; display: block;
  background: var(--s2); border: 1px solid var(--line);
  transition: background .2s ease, border-color .2s ease;
}
.setdots i.done { background: rgba(48, 209, 88, .3); border-color: rgba(48, 209, 88, .55); }
.setdots i.cur { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(76, 141, 255, .55); }
.setdots i.prep { opacity: .62; }

/* ---- LET'S GET IT ---- */
.ready {
  position: fixed; inset: 0; z-index: 30; background: #000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  animation: dim .35s ease;
}
@keyframes dim { from { opacity: 0; } to { opacity: 1; } }
.ready-in { width: 100%; max-width: 380px; text-align: center; animation: rise .45s cubic-bezier(.22,.9,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.ready-title { font-size: 38px; font-weight: 800; letter-spacing: -.04em; margin: 0 0 26px; }
.ready .back { top: 14px; left: 12px; }

/* ---- větvení partie → cviky ---- */
.tree { text-align: left; margin: 0 0 30px; padding-left: 4px; }
.branch { margin-bottom: 16px; animation: twig .5s cubic-bezier(.22,.9,.3,1) backwards; animation-delay: calc(.12s * var(--i) + .1s); }
.branch:last-child { margin-bottom: 0; }
@keyframes twig { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

.node-part {
  display: flex; align-items: center; gap: 9px;
  font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 2px;
}
.node-part .pin {
  width: 9px; height: 9px; border-radius: 3px; background: var(--accent);
  box-shadow: 0 0 14px rgba(76, 141, 255, .8); flex-shrink: 0;
}

.twigs { list-style: none; margin: 0 0 0 4px; padding: 0; }
.twigs li {
  position: relative; display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding-left: 24px;
}
/* svislá páteř */
.twigs li::before {
  content: ""; position: absolute; left: 0; top: 0; width: 1px; height: 100%;
  background: linear-gradient(180deg, rgba(76, 141, 255, .45), var(--line2));
}
/* první větev navazuje nahoru až na uzel partie */
.twigs li:first-child::before { top: -11px; height: calc(100% + 11px); }
.twigs li:last-child::before { height: 18px; }
.twigs li:first-child:last-child::before { top: -11px; height: 29px; }
/* vodorovná spojnice */
.twigs li::after {
  content: ""; position: absolute; left: 1px; top: 18px; width: 14px; height: 1px;
  background: var(--line2);
}
/* uzel */
.twigs li .j {
  position: absolute; left: 11px; top: 14px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--bg); border: 1.5px solid var(--accent); box-sizing: border-box;
}
.twigs li .nm { flex: 1; color: var(--muted); font-size: 13.5px; line-height: 1.3; }
.twigs li .n {
  color: var(--dim); font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  background: var(--s1); border-radius: 7px; padding: 3px 7px; flex-shrink: 0;
}

/* ---- průchod tréninkem: díl na cvik ---- */
.wprog { display: flex; gap: 5px; margin: 4px 0 14px; }
.wprog i {
  flex: 1; height: 15px; border-radius: 5px; background: var(--s2);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  color: #0a0f1a; overflow: hidden; position: relative;
}
.wprog i svg.ico { width: 11px; height: 11px; stroke-width: 3.2; }
.wprog i.done { background: var(--ok); border-color: var(--ok); }
/* aktuální cvik pomalu doutná – jeden pomalý průchod dokola */
.wprog i.cur {
  border-color: rgba(76, 141, 255, .5);
  background: linear-gradient(100deg,
    var(--s2) 0%, rgba(76, 141, 255, .18) 30%, var(--accent) 50%,
    rgba(76, 141, 255, .18) 70%, var(--s2) 100%);
  background-size: 260% 100%;
  animation: burn 6s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes burn { from { background-position: 130% 0; } to { background-position: -30% 0; } }
@media (prefers-reduced-motion: reduce) { .wprog i.cur { animation: none; background: var(--accent-soft); } }

/* ---- pauza během restu ---- */
.rest-ctrl { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 16px; }
.pause-btn {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: var(--s1); border: 1px solid var(--line2); color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .18s ease, color .18s ease, transform .1s ease;
}
.pause-btn svg.ico { width: 18px; height: 18px; }
.pause-btn:active { transform: scale(.9); }
.pause-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
/* malý čas vyjede vedle tlačítka */
.elapsed {
  display: grid; grid-template-columns: 0fr; opacity: 0;
  transition: grid-template-columns .38s cubic-bezier(.32,.72,0,1), opacity .25s ease;
}
.elapsed.show { grid-template-columns: 1fr; opacity: 1; }
.elapsed > * { min-width: 0; overflow: hidden; }
.elapsed span, .elapsed b { display: block; white-space: nowrap; }
.elapsed span {
  font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dim); padding-left: 4px;
}
.elapsed b {
  font-size: 20px; font-weight: 800; letter-spacing: -.03em; color: var(--muted);
  font-variant-numeric: tabular-nums; padding-left: 4px;
}
.timer.rest.paused { color: var(--muted); text-shadow: none; }

/* ---- rest: obsah drží místo, ať tlačítka nikam neskáčou ---- */
.rest-screen .rest-ctrl { min-height: 46px; }
.rest-screen .next-wrap { margin-top: 26px; }

/* ---- rekord: čas navýšit ---- */
.record-screen { justify-content: center; text-align: center; padding-top: 30px; animation: rise .4s cubic-bezier(.22,.9,.3,1); }
.rec-ico { display: flex; justify-content: center; color: var(--ok); margin-bottom: 12px; }
.rec-ico svg.ico { width: 46px; height: 46px; }
.rec-title { font-size: 30px; font-weight: 800; letter-spacing: -.035em; color: var(--ok); }
.rec-sub { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
.rec-box { background: var(--s1); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 24px; }
.rec-ex { font-size: 14.5px; font-weight: 800; letter-spacing: -.015em; }
.rec-nums { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.rec-nums b { color: var(--ok); font-weight: 800; }
.rec-k { color: var(--dim); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
.rec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.rec-opt {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 15px 6px; border-radius: 16px; border: 1px solid rgba(48, 209, 88, .35);
  background: rgba(48, 209, 88, .08); color: var(--ok); font-family: inherit; cursor: pointer;
  transition: background .12s ease, transform .08s ease;
}
.rec-opt b { font-size: 18px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rec-opt span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.rec-opt:active { background: var(--ok); color: #04140a; transform: scale(.96); }
.rec-opt:active span { color: rgba(4, 20, 10, .7); }

/* ---- minule / predikce ---- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 4px; }
.stats.one { grid-template-columns: 1fr; max-width: 190px; margin-inline: auto; }
.stat {
  background: var(--s1); border: 1px solid var(--line); border-radius: 16px;
  padding: 13px 10px; text-align: center;
}
.stat .k { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
.stat .v { font-size: 21px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.25; }
.stat .v + .v { color: var(--muted); font-size: 18px; }
/* stav predikce nese barvu */
.stat.up { border-color: rgba(48, 209, 88, .45); background: rgba(48, 209, 88, .08); }
.stat.up .k, .stat.up .v { color: var(--ok); }
.stat.up .v + .v { color: rgba(48, 209, 88, .75); }
.stat.hold { border-color: rgba(76, 141, 255, .4); background: var(--accent-soft); }
.stat.hold .k, .stat.hold .v { color: #a9c8ff; }
.stat.hold .v + .v { color: #7ea8f0; }
.stat.down { border-color: rgba(139, 124, 255, .4); background: rgba(139, 124, 255, .09); }
.stat.down .k, .stat.down .v { color: #c2baff; }
.stat.down .v + .v { color: #9d92e6; }
.stat.start { border-color: var(--line2); }
/* minule bez záznamu – tlumeně */
.stat.ghost .v { color: var(--muted); }
.stat.ghost .v + .v { color: var(--dim); }

/* ---- rest: countdown, bar, tlačítko, další ---- */
.rest-screen { justify-content: center; padding-top: 40px; }
.next-wrap { margin-top: 34px; }
.next-k {
  text-align: center; color: var(--dim); font-size: 11px; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; margin-bottom: 9px;
}
.next-box {
  background: var(--s1); border: 1px solid var(--line); border-radius: 16px;
  padding: 15px 16px; text-align: center;
}
.next-name { font-size: 15px; font-weight: 800; letter-spacing: -.015em; line-height: 1.25; }
.next-nums {
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.next-nums b { color: var(--accent); font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.next-nums span { color: var(--dim); }

/* ---- chipy ---- */
.chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
.chip {
  background: var(--s1); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 13px; font-size: 12.5px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.chip b { color: var(--text); font-weight: 800; }
.chip svg.ico { width: 14px; height: 14px; }
.chip.accent { border-color: rgba(76, 141, 255, .4); color: #a9c8ff; background: var(--accent-soft); }
.chip.accent b { color: #dce8ff; }
.chip.violet { border-color: rgba(139, 124, 255, .35); color: #c2baff; }
.chip.violet b { color: #e2deff; }

/* ---- timery ---- */
.timer-wrap { text-align: center; margin: 26px 0 20px; }
.timer { font-size: 82px; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1; }
.timer.work { color: var(--text); }
.timer.rest { color: var(--accent); text-shadow: 0 0 60px rgba(76, 141, 255, .45); }
.timer.rest.ending { color: var(--alert); text-shadow: 0 0 60px rgba(255, 69, 58, .45); animation: fade .55s infinite alternate; }
.timer { transition: color .35s ease, text-shadow .35s ease; }
@keyframes fade { from { opacity: 1; } to { opacity: .45; } }
.timer-label { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 11px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.timer-label svg.ico { width: 13px; height: 13px; }
.rest-bar { height: 3px; background: var(--s2); border-radius: 2px; margin: 18px 22px 0; overflow: hidden; }
.rest-bar i {
  display: block; height: 100%; width: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--violet), var(--accent));
  transform-origin: left; transition: transform .25s linear;
}

/* ---- steppery ---- */
.stepper { margin: 14px 0; }
.stepper .label { text-align: center; color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.stepper .row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.stepper .val { font-size: 46px; font-weight: 800; letter-spacing: -.045em; min-width: 145px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .val small { font-size: 16px; color: var(--dim); font-weight: 700; letter-spacing: 0; }
.step-btn {
  width: 62px; height: 62px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--s1); color: var(--accent); cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px;
  transition: background .12s ease, transform .08s ease;
}
.step-btn svg.ico { width: 20px; height: 20px; }
.step-btn span { font-size: 10px; font-weight: 800; color: var(--dim); }
.step-btn:active { background: var(--s3); transform: scale(.94); }

/* ---- RPE ---- */
.rpe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0 22px; }
.rpe-btn {
  padding: 26px 0; font-size: 24px; font-weight: 800; border-radius: 20px;
  border: 1px solid var(--line); background: var(--s1); color: var(--text);
  cursor: pointer; font-family: inherit; font-variant-numeric: tabular-nums;
  transition: background .12s ease, transform .08s ease;
}
.rpe-btn:active { background: var(--accent); border-color: var(--accent); transform: scale(.95); }

/* ---- spodní lišta ---- */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  background: rgba(0, 0, 0, .72); backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 1px solid var(--line); display: flex; max-width: 480px; margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; background: none; border: none; color: var(--dim); font-family: inherit;
  padding: 11px 0 10px; font-size: 10px; font-weight: 800; letter-spacing: .06em;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
}
nav button.active { color: var(--accent); }

  <script>
// ============================================================
// SPOTIFY – dva režimy, lišta je vidět vždycky:
//  1) BRIDGE  – na Macu přes server.py → AppleScript (nic se nenastavuje)
//  2) WEB API – všude jinde (GitHub Pages, mobil), přes PKCE
//     Potřebuje Client ID z developer.spotify.com a Premium účet.
//     Redirect URI = přesně adresa, na které appka běží.
// Sbalené = jen logo. Rozbalené = playbar. Stav se pamatuje.
// ============================================================
"use strict";

const SPOTIFY_LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname) ||
  /^192\.168\.|^10\./.test(location.hostname);

// ---------- Web API (PKCE) ----------
// Client ID je veřejný údaj, PKCE ho schovávat nemusí.
// Client Secret tady NENÍ a být nesmí – repo je veřejné a PKCE ho nepoužívá.
const SPOTIFY_CLIENT_ID = "429ae1ef523a4960a4f457b979e483fb";

const SpotifyWeb = {
  SCOPES: "user-read-playback-state user-modify-playback-state user-read-currently-playing",
  token: null,
  get clientId() { return localStorage.getItem("sp_client_id") || SPOTIFY_CLIENT_ID; },
  set clientId(v) { localStorage.setItem("sp_client_id", v); },
  get refreshToken() { return localStorage.getItem("sp_refresh") || ""; },
  set refreshToken(v) { v ? localStorage.setItem("sp_refresh", v) : localStorage.removeItem("sp_refresh"); },
  redirect() { return location.origin + location.pathname; },
  connected() { return !!this.refreshToken; },

  async init() {
    // ať prohlížeč úložiště nevyhodí a propojení vydrží
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
    const p = new URLSearchParams(location.search);
    if (p.get("code")) {
      await this.exchange(p.get("code"));
      // POZOR: `history` je v téhle appce pole tréninků, proto window.history
      window.history.replaceState({}, "", this.redirect());
    }
    if (this.connected()) await this.refresh();
  },

  async login() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const verifier = [...crypto.getRandomValues(new Uint8Array(64))].map((b) => chars[b % chars.length]).join("");
    localStorage.setItem("sp_verifier", verifier);
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
    const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
      client_id: this.clientId, response_type: "code", redirect_uri: this.redirect(),
      scope: this.SCOPES, code_challenge_method: "S256", code_challenge: challenge,
    });
  },

  // Spotify při PKCE refresh token rotuje – nový se musí hned uložit,
  // jinak se propojení příště rozpadne.
  store(r) {
    if (!r || !r.access_token) return false;
    this.token = r.access_token;
    if (r.refresh_token) this.refreshToken = r.refresh_token;
    const ttl = (r.expires_in || 3600) * 1000;
    localStorage.setItem("sp_expires", String(Date.now() + ttl));
    clearTimeout(this._renew);
    this._renew = setTimeout(() => this.refresh(), Math.max(30000, ttl - 300000)); // 5 min před vypršením
    return true;
  },

  async exchange(code) {
    try {
      const r = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: this.clientId, grant_type: "authorization_code", code,
          redirect_uri: this.redirect(), code_verifier: localStorage.getItem("sp_verifier") || "",
        }),
      }).then((x) => x.json());
      this.store(r);
    } catch {}
  },

  async refresh() {
    if (!this.refreshToken) return false;
    try {
      const r = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id: this.clientId, grant_type: "refresh_token", refresh_token: this.refreshToken }),
      }).then((x) => x.json());
      if (this.store(r)) return true;
      // token odvolaný nebo neplatný → ať appka ví, že se má přihlásit znovu
      if (r && (r.error === "invalid_grant" || r.error === "invalid_request")) this.disconnect();
      return false;
    } catch { return false; }  // bez signálu token nezahazuj
  },

  async api(method, path, retry = true) {
    if (!this.token && !(await this.refresh())) return null;
    let r;
    try {
      r = await fetch("https://api.spotify.com/v1" + path, { method, headers: { Authorization: "Bearer " + this.token } });
    } catch { return null; }
    if (r.status === 401 && retry) {
      if (await this.refresh()) return this.api(method, path, false);
      return null;
    }
    if (r.status === 204 || r.status === 202) return {};
    try { return await r.json(); } catch { return {}; }
  },

  async now() {
    if (!this.connected()) return { ok: false, reason: "Spotify nepřipojeno" };
    const s = await this.api("GET", "/me/player");
    if (!s || !s.item) return { ok: false, reason: "nic nehraje" };
    return { ok: true, track: s.item.name, artist: s.item.artists.map((a) => a.name).join(", "), playing: !!s.is_playing };
  },
  async cmd(c) {
    if (c === "next") await this.api("POST", "/me/player/next");
    else if (c === "prev") await this.api("POST", "/me/player/previous");
    else if (c === "toggle") {
      const s = await this.api("GET", "/me/player");
      await this.api("PUT", s && s.is_playing ? "/me/player/pause" : "/me/player/play");
    }
    return this.now();
  },
  disconnect() {
    this.refreshToken = null; this.token = null;
    localStorage.removeItem("sp_expires");
    clearTimeout(this._renew);
  },
};

// po probuzení telefonu / návratu do appky si rovnou obnov token
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !SpotifyWeb.connected()) return;
  const exp = +(localStorage.getItem("sp_expires") || 0);
  if (Date.now() > exp - 60000) SpotifyWeb.refresh().then(() => SpotifyUI.poll());
});

// ---------- lišta ----------
const SpotifyUI = {
  mode: SPOTIFY_LOCAL ? "bridge" : "web",
  state: { ok: false, track: "", artist: "", playing: false, reason: "Spotify nepřipojeno" },
  open: localStorage.getItem("sp_open") === "1",

  async init() {
    if (this.mode === "web") await SpotifyWeb.init();
    await this.poll();
  },

  connected() { return this.mode === "bridge" || SpotifyWeb.connected(); },

  toggleOpen() {
    this.open = !this.open;
    localStorage.setItem("sp_open", this.open ? "1" : "0");
    document.querySelectorAll(".spotify").forEach((el) => el.classList.toggle("open", this.open));
    if (this.open) this.poll();
  },

  async call(cmd) {
    try {
      if (this.mode === "bridge") {
        const r = await fetch("/api/spotify/" + cmd, { cache: "no-store" });
        this.state = await r.json();
      } else {
        this.state = cmd === "now" ? await SpotifyWeb.now() : await SpotifyWeb.cmd(cmd);
      }
    } catch { this.state = { ok: false, reason: "nedostupné" }; }
    this.paint();
  },

  async poll() {
    await this.call("now");
    clearTimeout(this._t);
    if (this.open) this._t = setTimeout(() => this.poll(), 8000);
  },

  paint() {
    document.querySelectorAll("[data-sp-track]").forEach((el) => (el.innerHTML = this.label()));
    document.querySelectorAll("[data-sp-play]").forEach((el) => (el.innerHTML = this.state.playing ? I.pause() : I.play()));
    document.querySelectorAll(".spotify").forEach((el) => el.classList.toggle("live", !!this.state.playing));
  },

  label() {
    if (!this.state.ok) return esc(this.state.reason || "Spotify nedostupné");
    return `<b>${esc(this.state.track)}</b><span>${esc(this.state.artist)}</span>`;
  },

  panel() {
    if (this.mode === "web" && !SpotifyWeb.connected()) {
      return `<button class="sp-connect" onclick="SpotifyWeb.login()">Propojit Spotify</button>`;
    }
    return `<button onclick="spCmd('prev')" aria-label="Předchozí">${I.prev()}</button>
      <button class="main" data-sp-play onclick="spCmd('toggle')" aria-label="Přehrát">${this.state.playing ? I.pause() : I.play()}</button>
      <button onclick="spCmd('next')" aria-label="Další">${I.next()}</button>
      <span class="sp-track" data-sp-track>${this.label()}</span>`;
  },

  // sbalené = jen kolečko s logem uprostřed, rozbaluje se do strany
  // vedle něj je ozubené kolo – zmizí, jakmile se playbar otevře
  bar(gear) {
    return `<div class="spotify ${this.open ? "open" : ""} ${this.state.playing ? "live" : ""}">
      <div class="sp-pill ${gear ? "with-gear" : ""}">
        <button class="sp-logo" onclick="SpotifyUI.toggleOpen()" aria-label="Spotify">${I.spotify()}</button>
        <div class="sp-panel"><div class="sp-inner">${this.panel()}</div></div>
        ${gear ? `<button class="sp-gear" onclick="openOrder()" aria-label="Pořadí cviků">${I.gear()}</button>` : ""}
      </div>
    </div>`;

// ============================================================
// CLOUD SYNC – jsonblob.com

"use strict";

  API: "https://jsonblob.com/api/jsonBlob",
  get id() { return localStorage.getItem("sync_id") || SYNC_DEFAULT_ID; },
  set id(v) { v ? localStorage.setItem("sync_id", v) : localStorage.removeItem("sync_id"); },
  get last() { return localStorage.getItem("sync_last") || null; },
  status: "off", // off | ok | busy | err
  msg: "",
  enabled() { return true; },   // vždycky zapnutý

  // lokální záloha pro případ, že by se cloud rozsypal
  backup() {

  url() { return `${this.API}/${this.id}`; },

        body: JSON.stringify(this.payload()),

  done(status, msg) {

  label() {

  },
};

// když appku zavřu nebo přepnu jinam, dorovnej to hned

function closeOrder() { session.orderOpen = false; session._draft = null; DB.set("session", session); render(); }
function saveOrder() {
  if (session._draft) {
    // hotové cviky zůstávají vpředu, mění se jen ty, co mě ještě čekají
    session.order = session.order.slice(0, session.exIndex).concat(session._draft);
    session._draft = null;
  }
  session.orderOpen = false; DB.set("session", session); pushNow(); render();
}
function viewOrder() {
  const list = curW().exercises;
  const rest = session.order.slice(session.exIndex);
  return `<div class="modal-wrap" onclick="closeOrder()">
    <div class="modal order-modal" onclick="event.stopPropagation()">
      <div class="m-title">Změň pořadí cviků</div>
      <div class="m-sub">Přetáhni za úchyt. Klepnutím na cvik na něj rovnou skočíš.</div>
      <div class="order-list" id="orderList">
        ${rest.map((oi, k) => {
          const done = session.entries[list[oi].id]?.sets.length || 0;
          return `<div class="order-item ${k === 0 ? "cur" : ""}" data-oi="${oi}" onclick="jumpTo(${oi})">
            <i class="grip" onclick="event.stopPropagation()">${I.grip()}</i>
            <span>${esc(list[oi].name)}</span>
            ${done ? `<b class="odone">${done}×</b>` : ""}</div>`;
        }).join("")}
      </div>
      <div class="m-row">
        <button class="btn btn-2" onclick="closeOrder()">Zpět</button>
        <button class="btn btn-primary" onclick="saveOrder()">Potvrdit</button>
      </div>
    </div>
  </div>`;
}
// skok na konkrétní cvik – odcvičené série si drží
function jumpTo(oi) {
  if (session._draft) {
    session.order = session.order.slice(0, session.exIndex).concat(session._draft);
    session._draft = null;
  }
  const idx = session.order.indexOf(oi);
  if (idx < 0) return;
  const ex = curW().exercises[oi];
  session.exIndex = idx;
  session.setIndex = session.entries[ex.id]?.sets.length || 0;
  session.phase = "work"; session.workStart = Date.now();
  session.orderOpen = false; session._afterRpe = false;
  DB.set("session", session); pushNow(); render();
}
// přetahování prstem i myší
function initOrderDrag() {
  const list = $("#orderList");
  if (!list) return;
  let drag = null;
  const items = () => [...list.querySelectorAll(".order-item")];
  const commit = () => { session._draft = items().map((el) => +el.dataset.oi); };
  list.querySelectorAll(".grip").forEach((h) => {
    h.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const el = h.closest(".order-item");
      drag = { el, y: e.clientY, h: el.offsetHeight };
      el.classList.add("dragging");
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dy = e.clientY - drag.y;
      drag.el.style.transform = `translateY(${dy}px)`;
      const others = items().filter((x) => x !== drag.el);
      for (const o of others) {
        const r = o.getBoundingClientRect(), c = r.top + r.height / 2;
        const dr = drag.el.getBoundingClientRect(), dc = dr.top + dr.height / 2;
        if ((dc < c && o.compareDocumentPosition(drag.el) & Node.DOCUMENT_POSITION_FOLLOWING) ||
            (dc > c && o.compareDocumentPosition(drag.el) & Node.DOCUMENT_POSITION_PRECEDING)) {
          continue;
        }
        if (dc < c && dr.top < c && o.compareDocumentPosition(drag.el) & 2) { list.insertBefore(drag.el, o); drag.y = e.clientY; drag.el.style.transform = ""; break; }
        if (dc > c && dr.bottom > c && o.compareDocumentPosition(drag.el) & 4) { list.insertBefore(drag.el, o.nextSibling); drag.y = e.clientY; drag.el.style.transform = ""; break; }
      }
    });
    const end = () => { if (!drag) return; drag.el.style.transform = ""; drag.el.classList.remove("dragging"); drag = null; commit(); };
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
  });
}

// ✕ → potvrzení přímo v appce
function askAbort() { session.ask = true; DB.set("session", session); render(); }
function closeAsk() { session.ask = false; DB.set("session", session); render(); }
function viewAsk() {
  const done = Object.values(session.entries || {}).reduce((a, e) => a + e.sets.length, 0);
  return `<div class="modal-wrap" onclick="closeAsk()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="m-title">Opravdu chceš ukončit trénink?</div>
      <div class="m-sub">${done ? `${done} ${plural(done, "série se uloží", "série se uloží", "sérií se uloží")}.` : "Zatím tu nic odcvičeného není."}</div>
      <div class="m-row">
        <button class="btn btn-2" onclick="closeAsk()">Ne</button>
        <button class="btn btn-primary" onclick="endWorkoutEarly()">Ano, ukončit</button>
      </div>
      <button class="btn btn-3 danger" onclick="discardWorkout()">${I.close()}Smazat trénink bez uložení</button>
    </div>
  </div>`;
}
// ukončí trénink, ale co je odcvičené, uloží
function endWorkoutEarly() {
  const has = Object.values(session.entries || {}).some((e) => e.sets.length);
  if (has) {
    history.push({
      date: session.date, workoutId: session.workoutId, workoutName: session.workoutName,
      durationMin: Math.max(1, Math.round((Date.now() - session.startedAt) / 60000)),
      exercises: Object.values(session.entries).filter((e) => e.sets.length),
    });
    DB.set("history", history);
  }
  session = null; DB.set("session", null); keepAwake(false); pushNow(); render();
}
function discardWorkout() {
  session = null; DB.set("session", null); keepAwake(false); pushNow(); render();
}
function endExercise() {
  const ex = curEx();
  if (session.entries[ex.id]?.sets.length) {
    startRest(plan.restBetweenExercises || 120);
    session.phase = "rpe"; DB.set("session", session); return render();
  }
  if (session.exIndex >= curExs().length - 1) return finishWorkout();
  session.exIndex++; session.setIndex = 0; session.phase = "work"; session.workStart = Date.now();
  DB.set("session", session); render();
}

// ---------- globální hodiny ----------
setInterval(() => {
  // boxerský timer
  if (box && (box.phase === "work" || box.phase === "rest")) {
    const left = Math.max(0, (box.endAt - (box.paused ? box.pausedAt : Date.now())) / 1000);
    const el = $("#boxTimer"), bar = $("#boxBar");
    if (el) el.textContent = fmtTime(Math.ceil(left));
    if (bar) bar.style.transform = `scaleX(${left / (box.phase === "work" ? box.work : box.rest)})`;
    if (!box.paused) {
      box._b = box._b || {};
      if (left <= 10 && !box._b.ten) { box._b.ten = 1; beep(880, 0.1, 0.05); }
      if (left <= 0) boxNext();
    }
  }
  if (!session) return;
  if (session.phase === "work") {
    const el = $("#workTimer");
    if (el) el.textContent = fmtTime((Date.now() - session.workStart) / 1000);
  } else if (session.phase === "rest" || session.phase === "rpe" || session.phase === "record") {
    const now = Date.now();
    const ref = session.paused ? session.pausedAt : now;      // pauza countdown zmrazí
    const left = Math.max(0, (session.restEnd - ref) / 1000);
    const el = $("#restTimer"), bar = $("#restBar"), mini = $("#navRest");
    if (el) { el.textContent = fmtTime(Math.ceil(left)); el.classList.toggle("ending", left <= 10 && left > 0 && !session.paused); }
    if (bar) bar.style.transform = `scaleX(${left / session.restTotal})`;
    if (mini) mini.textContent = fmtTime(Math.ceil(left));
    // skutečně uběhlý čas pauzy – běží pořád, i když je countdown zastavený
    const elapsed = $("#restElapsed");
    if (elapsed && session.restStart) elapsed.textContent = fmtTime((now - session.restStart) / 1000);
    if (session.paused) return;
    // pípne jen dvakrát: v 10 sekundách a na konci – i když jsem na RPE
    if (left <= 10 && !session._beeped.ten) { session._beeped.ten = 1; beep(880, 0.14, 0.07); }
    if (left <= 0 && !session._beeped.end) { session._beeped.end = 1; gong(); }
    if (left <= 0 && session.phase === "rest") endRest();
  }
}, 200);

// ---------- render ----------
function render() {
  let html;
  if (box) html = viewBox();
  else if (tab === "dash") html = dashView === "settings" ? viewSettings() : dashEx ? viewExDetail(dashEx) : viewDash();
  else if (!session) html = viewHome();
  else if (session.phase === "ready") html = viewReady();
  else if (session.phase === "work") html = viewWork();
  else if (session.phase === "log") html = viewLog();
  else if (session.phase === "rest") html = viewRest();
  else if (session.phase === "record") html = viewRecord();
  else if (session.phase === "rpe") html = viewRpe();
  else html = viewSummary();
  // během tréninku a boxu spodní navigace mizí, dole jsou akční tlačítka
  const inWorkout = !!box || (session && tab === "workout" && session.phase !== "summary");
  $("#app").className = inWorkout ? "in-workout" : "";
  $("#app").innerHTML = html + (inWorkout ? "" : viewNav())
    + (session && session.ask ? viewAsk() : "")
    + (session && session.orderOpen ? viewOrder() : "")
    + (weekOpen ? viewWeekEdit() : "") + (planOpen ? viewPlan4() : "");
  if (session && session.orderOpen) initOrderDrag();
  if (tab === "dash" && dashEx && dashView !== "settings") drawExCharts(dashEx);
  if (typeof paintSync === "function") paintSync();
}
function viewNav() {
  const resting = session && session.phase === "rest" && tab !== "workout";
  return `<nav>
    <button class="${tab === "workout" ? "active" : ""}" onclick="switchTab('workout')">${I.dumbbell()}${resting ? `<b id="navRest">--:--</b>` : "Trénink"}${session && !resting ? '<i class="live"></i>' : ""}</button>
    <button class="${tab === "dash" ? "active" : ""}" onclick="switchTab('dash')">${I.chart()}Dashboardy</button>
  </nav>`;
}
function switchTab(t) { tab = t; dashEx = null; dashView = "list"; render(); }

// ---------- home ----------
const DOW = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
function weekDays() {
  const now = new Date(), off = (now.getDay() + 6) % 7;
  const mon = new Date(now); mon.setDate(now.getDate() - off); mon.setHours(0, 0, 0, 0);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const key = iso(d), ov = plan.overrides || {};
    return { date: d, key, dow: DOW[i], num: d.getDate(),
      workoutId: key in ov ? ov[key] : plan.schedule[i + 1] || null,
      done: history.find((h) => h.date === key) || null, isToday: key === today() };
  });
}
function viewHome() {
  const days = weekDays(), t = days.find((d) => d.isToday);

  } else if (todayW) {
    hero = `<div class="hero"><div class="kicker">Dnes tě čeká</div>
      <div class="htitle">${esc(todayW.name)}</div>
      <div class="hfocus">${esc(todayW.focus)} · ${todayW.exercises.length} cviků · ${todayW.exercises.reduce((a, e) => a + e.sets.length, 0)} setů</div>

  }

  return `<div class="screen">
    <div class="logo-row">${I.bat("bat-mark")}<h1 class="brand">Batcave <em>Gym</em></h1></div>
    <h2>${I.calendar()}Tento týden
      <button class="h2-act" onclick="openWeek()">upravit</button>

// ---------- statistiky za 7 dní ----------
function last7() {
  const days = [];
  const base = new Date(); base.setHours(0, 0, 0, 0);
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base); d.setDate(base.getDate() - i);
    const key = iso(d);
    const hs = history.filter((h) => h.date === key);
    const ton = hs.reduce((a, h) => a + h.exercises.reduce((b, e) => b + e.sets.reduce((c, s) => c + s.w * s.r, 0), 0), 0);
    const sets = hs.reduce((a, h) => a + h.exercises.reduce((b, e) => b + e.sets.length, 0), 0);
    days.push({ key, dow: DOW[(d.getDay() + 6) % 7], ton, sets, n: hs.length });
  }
  const max = Math.max(1, ...days.map((d) => d.ton));
  const totT = days.reduce((a, d) => a + d.ton, 0);
  const totS = days.reduce((a, d) => a + d.sets, 0);
  const n = days.filter((d) => d.n).length;
  const rpes = history.filter((h) => days.some((d) => d.key === h.date)).flatMap((h) => h.exercises.map((e) => e.rpe)).filter((x) => x != null);
  const avgRpe = rpes.length ? (rpes.reduce((a, b) => a + b, 0) / rpes.length).toFixed(1).replace(".", ",") : "–";
  const bars = days.map((d, i) => `<div class="b7">
      <i style="height:${d.ton ? Math.max(8, (d.ton / max) * 100) : 3}%;--i:${i}" class="${d.ton ? "on" : ""}"></i>
      <span>${d.dow}</span></div>`).join("");
  return `<h2>${I.chart()}Posledních 7 dní</h2>
    <div class="s7">
      <div class="s7-nums">
        <div><b>${n}</b><span>${plural(n, "trénink", "tréninky", "tréninků")}</span></div>
        <div><b>${totS}</b><span>sérií</span></div>
        <div><b>${Math.round(totT / 1000).toLocaleString("cs-CZ")}t</b><span>objem</span></div>
        <div><b>${avgRpe}</b><span>RPE</span></div>
      </div>
      <div class="s7-bars">${bars}</div>
    </div>`;
}

// ---------- plán na 4 týdny + úprava týdne ----------
let weekOpen = false, planOpen = false;
function openWeek() { weekOpen = true; render(); }
function closeWeek() { weekOpen = false; render(); }
function openPlan() { planOpen = true; render(); }
function closePlan() { planOpen = false; render(); }

function dayPlan(d) {
  const key = iso(d), ov = plan.overrides || {};
  return key in ov ? ov[key] : plan.schedule[((d.getDay() + 6) % 7) + 1] || null;
}
function setDay(key, wid) {
  plan.overrides = plan.overrides || {};
  plan.overrides[key] = wid || null;
  DB.set("plan", plan); render();
}
function viewWeekEdit() {
  const rows = weekDays().map((d) => `<div class="dayrow ${d.isToday ? "today" : ""}">
      <span class="dl">${d.dow} ${d.num}.</span>
      <div class="dpick">
        ${plan.workouts.map((w) => `<button class="${d.workoutId === w.id ? "on" : ""}" onclick="setDay('${d.key}','${w.id}')">${w.id}</button>`).join("")}
        <button class="rest ${!d.workoutId ? "on" : ""}" onclick="setDay('${d.key}','')">–</button>
      </div>
    </div>`).join("");
  return `<div class="modal-wrap" onclick="closeWeek()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="m-title">Tento týden</div>
      <div class="m-sub">Klepni na písmeno tréninku nebo na – pro volno.</div>
      <div class="daylist">${rows}</div>
      <div class="m-row"><button class="btn btn-primary" onclick="closeWeek()">Hotovo</button></div>
    </div>
  </div>`;
}
function viewPlan4() {
  const base = new Date(); base.setHours(0, 0, 0, 0);
  const mon = new Date(base); mon.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  const weeks = [];
  for (let w = 0; w < 4; w++) {
    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(mon); d.setDate(mon.getDate() + w * 7 + i);
      return { d, key: iso(d), wid: dayPlan(d), isToday: iso(d) === today(), done: history.some((h) => h.date === iso(d)) };
    });
    weeks.push({ from: days[0].d, days });
  }
  return `<div class="modal-wrap" onclick="closePlan()">
    <div class="modal wide" onclick="event.stopPropagation()">
      <div class="m-title">Plán na 4 týdny</div>
      <div class="p4">
        ${weeks.map((wk) => `<div class="p4w">
          <div class="p4h">${wk.from.getDate()}. ${wk.from.getMonth() + 1}.</div>
          <div class="p4d">${wk.days.map((x) => `<i class="${x.wid ? "has" : ""} ${x.isToday ? "today" : ""} ${x.done ? "done" : ""}">${x.wid || "–"}</i>`).join("")}</div>
        </div>`).join("")}
      </div>
      <div class="m-sub">${DOW.join(" · ")}</div>
      <div class="m-row"><button class="btn btn-primary" onclick="closePlan()">Zavřít</button></div>
    </div>
  </div>`;
}

// ---------- LET'S GET IT ----------
function viewReady() {
  const w = curW();
  // cviky se seskupí po partiích tak, jak jdou v plánu za sebou
  const groups = [];
  for (const e of w.exercises) {
    const g = groups[groups.length - 1];
    if (g && g.part === e.part) g.items.push(e);
    else groups.push({ part: e.part, items: [e] });
  }
  const tree = groups.map((g, gi) => `<div class="branch" style="--i:${gi}">
      <div class="node-part"><i class="pin"></i>${esc(g.part)}</div>
      <ul class="twigs">${g.items.map((e) => `<li><i class="j"></i>
        <span class="nm">${esc(e.name)}</span><span class="n">${e.sets.length}×</span></li>`).join("")}</ul>
    </div>`).join("");

  return `<div class="ready">
    <button class="back" onclick="discardWorkout()" aria-label="Zpět">${I.close()}</button>
    <div class="ready-in">
      <div class="ready-title">${esc(w.name)}</div>
      <div class="tree">${tree}</div>
      <button class="btn btn-primary btn-huge" onclick="letsGo()">${I.bolt()}Let's get it</button>
    </div>
  </div>`;
}

function head(ex) {

  </div>`;

// stabilní „náhodné" opakování, když z minula žádné číslo není
function seededReps(exId, i, from, to) {
  const s = exId + ":" + i;
  let h = 2166136261;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619); }
  return from + (Math.abs(h) % (to - from + 1));
}
// vlevo minule, vpravo plán s cílovým rozsahem opakování
function statsBlock(ex, i) {
  const ls = lastSet(ex.id, i), sp = setSpec(ex, i), p = planFor(ex, i);
  const prevR = ls ? ls.r : seededReps(ex.id, i, sp.from, sp.to);
  const prevW = ls ? ls.w : sp.kg ?? p.w;
  return `<div class="stats">
    <div class="stat ${ls ? "" : "ghost"}">
      <div class="k">Minule</div>
      <div class="v">${prevR} op.</div>
      <div class="v">${fmtW(prevW)} kg</div>
    </div>
    <div class="stat ${p.state}">
      <div class="k">Plán</div>
      <div class="v">${p.from}–${p.to} op.</div>
      <div class="v">${fmtW(p.w)} kg</div>
    </div>
  </div>`;
}
function viewRecord() {

let box = DB.get("box", null);
const boxCfg = () => DB.get("boxCfg", { rounds: 3, work: 120, rest: 60 });

function openBox() {
  const c = boxCfg();
  box = { ...c, phase: "setup", round: 1, endAt: 0, paused: false, pausedAt: 0 };
  DB.set("box", box); render();
}
function closeBox() { box = null; DB.set("box", null); render(); }
function boxSet(k, d) {
  const lim = k === "rounds" ? [1, 20] : [10, 120];
  const step = k === "rounds" ? 1 : 10;
  box[k] = Math.min(lim[1], Math.max(lim[0], box[k] + d * step));
  DB.set("boxCfg", { rounds: box.rounds, work: box.work, rest: box.rest });
  DB.set("box", box); render();
}
function boxStart() {
  box.phase = "work"; box.round = 1; box.endAt = Date.now() + box.work * 1000;
  box._b = {}; DB.set("box", box); bell(); render();
}
function boxTogglePause() {
  if (box.paused) { box.endAt += Date.now() - box.pausedAt; box.paused = false; }
  else { box.paused = true; box.pausedAt = Date.now(); }
  DB.set("box", box);
  const b = $("#boxPause"); if (b) b.innerHTML = box.paused ? I.play() : I.pause();
  const s = $(".box-screen"); if (s) s.classList.toggle("paused", box.paused);
}
function boxNext() {
  if (box.phase === "work") {
    if (box.round >= box.rounds) { box.phase = "done"; DB.set("box", box); bell(); setTimeout(bell, 700); return render(); }
    box.phase = "rest"; box.endAt = Date.now() + box.rest * 1000;
  } else {
    box.round++; box.phase = "work"; box.endAt = Date.now() + box.work * 1000;
  }
  box._b = {}; DB.set("box", box); bell(); render();
}
// boxerský gong, ztlumený
function bell() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    [784, 1174, 1568].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = i === 0 ? "triangle" : "sine";
      o.frequency.setValueAtTime(f, t);
      const peak = 0.3 / (i + 1.4);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + 1.7);
    });
  } catch {}
}
function viewBox() {
  if (box.phase === "setup") {
    const row = (k, label, val) => `<div class="brow">

    </div>

// ---------- doporučení ----------
function recos() {
  const out = [];
  for (const ex of allEx()) {
    const h = exHistory(ex.id);
    if (!h.length) continue;
    for (let i = 0; i < ex.sets.length; i++) {
      const p = planFor(ex, i), ls = lastSet(ex.id, i);
      if (!ls) continue;
      if (p.state === "up") {
        out.push({ ex, p, prio: 0, why: `set ${i + 1}: navýšeno na ${fmtW(p.w)} kg – příště to vyjeď` });
        break;
      }
      if (p.state === "down") {
        out.push({ ex, p, prio: 1, why: `set ${i + 1}: minule ${ls.r} op. při cíli ${p.from}–${p.to} – drž ${fmtW(p.w)} kg` });
        break;
      }
    }
  }
  return out.sort((a, b) => a.prio - b.prio);
}
function weekStats() {
  const keys = weekDays().map((d) => d.key);
  const hs = history.filter((h) => keys.includes(h.date));
  const sets = hs.reduce((a, h) => a + h.exercises.reduce((b, e) => b + e.sets.length, 0), 0);
  const ton = hs.reduce((a, h) => a + h.exercises.reduce((b, e) => b + e.sets.reduce((c, s) => c + s.w * s.r, 0), 0), 0);
  const rpes = hs.flatMap((h) => h.exercises.map((e) => e.rpe)).filter((x) => x != null);
  return { n: hs.length, sets, ton, rpe: rpes.length ? (rpes.reduce((a, b) => a + b, 0) / rpes.length).toFixed(1).replace(".", ",") : null };
}

// roste síla partie, nebo stojí?
function exTrend(ex) {
  const h = exHistory(ex.id);
  if (h.length < 2) return h.length ? "flat" : "none";
  const last = topW(h[h.length - 1].sets), prev = topW(h[h.length - 2].sets);
  return last > prev ? "up" : last < prev ? "down" : "flat";
}
function groupTrend(g) {
  const exs = exInGroup(g), t = exs.map(exTrend);
  const up = t.filter((x) => x === "up").length;
  const active = t.filter((x) => x !== "none").length;
  if (!active) return { state: "none", label: "zatím nic" };
  if (up) return { state: "up", label: `${up} ${plural(up, "cvik roste", "cviky rostou", "cviků roste")}` };
  return { state: "flat", label: "drží se" };
}

        <div class="btn-row"><button class="btn btn-primary" style="font-size:14px;padding:14px" onclick="syncStart()">${I.cloud()}Zapnout sync</button></div>
        <div class="btn-row"><button class="btn btn-3" onclick="syncJoin()">Mám kód z jiného zařízení</button></div>
      </div>`;

  const sp = SPOTIFY_LOCAL
    ? `<div class="panel"><div class="title">Spotify přes Mac</div>
        <div class="meta">Ovládá appku ve Spotify na tomhle počítači. Nic se nenastavuje.</div></div>`
    : SpotifyWeb.connected()
      ? `<div class="panel">
          <div class="title"><span class="sync-dot ok"></span>Spotify propojené</div>
          <div class="meta">Drží se to natrvalo – token se sám obnovuje na pozadí. Odpojí se, jen když ho zrušíš tady nebo ve svém Spotify účtu.</div>
          <div class="btn-row"><button class="btn btn-3" onclick="SpotifyWeb.disconnect();render()">Odpojit Spotify</button></div>
        </div>`
      : `<div class="panel"><div class="title">Spotify není propojené</div>
          <div class="meta">Propojíš ho jednou a zůstane to tak.</div>
          <div class="btn-row"><button class="btn btn-2" onclick="SpotifyWeb.login()">Propojit Spotify</button></div>
        </div>`;

  return `<div class="screen">
    <div class="topbar"><button class="back" onclick="dashView='list';render()">${I.chevronL()}</button></div>
    <h1 class="brand">Nastavení</h1>
    <div class="sub">sync, spotify, kroky vah, záloha</div>
    <h2>${I.cloud()}Cloud sync</h2>
    ${sync}
    <h2>${I.spotify()}Spotify</h2>
    ${sp}
    <h2>${I.gear()}Kroky vah</h2>
    <div class="muted" style="margin-bottom:10px">O kolik kg skáčou tlačítka ± u každého cviku.</div>
    ${rows}
    <h2>${I.history()}Záloha</h2>
    <div class="btn-row">
      <button class="btn btn-2" onclick="exportData()">Export JSON</button>
      <button class="btn btn-2" onclick="importPrompt()">Import</button>
    </div>
    <div id="ioArea"></div>
    <div class="btn-row"><button class="btn btn-3" onclick="resetOverrides()">Vrátit kroky vah na původní</button></div>
    <div class="btn-row"><button class="btn btn-3 danger" onclick="resetToday()">${I.undo()}Vyresetovat dnešní trénink</button></div>
    <div class="muted center" style="font-size:11.5px;margin-top:6px">Smaže jen dnešek. Starší tréninky a cíle vah zůstanou.</div>
  </div>`;
}
async function syncStart() { const id = await Sync.create(); if (id) { alert("Sync zapnutý.\n\nKód:\n" + id + "\n\nZadej ho na mobilu."); render(); } else alert("Nepovedlo se: " + Sync.msg); }
async function syncJoin() {
  const id = prompt("Vlož sync kód z druhého zařízení:");
  if (!id) return;
  const ok = await Sync.connect(id);
  alert(ok ? "Napojeno, data stažena." : "Nepovedlo se: " + Sync.msg);
  render();
}
function copySync() { navigator.clipboard?.writeText(Sync.id); alert("Kód zkopírován."); }
function copyLink() {
  const l = Sync.link();
  navigator.clipboard?.writeText(l);
  alert("Odkaz zkopírován:\n\n" + l + "\n\nOtevři ho na dalším zařízení – napojí se samo.");
}
function setStep(id, v) { overrides[id] = { ...(overrides[id] || {}), step: v }; DB.set("overrides", overrides); applyOverrides(); render(); }
function setRest(id, d) {
  const ex = allEx().find((e) => e.id === id);
  const v = Math.max(30, (ex.rest || 120) + d);
  overrides[id] = { ...(overrides[id] || {}), rest: v, restPrep: Math.max(30, Math.round(v * 0.7 / 5) * 5) };
  DB.set("overrides", overrides); applyOverrides(); render();
}
// smaže jen dnešek – rozdělaný i uložený trénink z dnešního dne
function resetToday() {
  const t = today();
  const n = history.filter((h) => h.date === t).length;
  if (!confirm(`Vyresetovat dnešní trénink?\n\n${n ? `Smaže se ${n} uložený trénink z dneška` : "Smaže se rozdělaný trénink"} a začneš na čisto.\nStarší tréninky a cíle vah zůstanou.`)) return;
  history = history.filter((h) => h.date !== t);
  DB.set("history", history);
  session = null; DB.set("session", null);
  keepAwake(false); pushNow();
  tab = "workout"; dashView = "list"; dashEx = null;
  render();
}
function resetOverrides() {
  if (!confirm("Vrátit všechny kroky vah a pauzy na původní?")) return;
  overrides = {}; DB.set("overrides", overrides);
  plan = JSON.parse(JSON.stringify(DEFAULT_PLAN)); DB.set("plan", plan); render();
}

// ---------- graf ----------
function drawChart(id, pts, unit = "kg", colors = ["#8b7cff", "#4c8dff"], fixMin, fixMax) {
  const c = $("#" + id); if (!c) return;
  const x = c.getContext("2d"), W = c.width, H = c.height, pad = 30;
  x.clearRect(0, 0, W, H);
  if (!pts.length) {
    x.font = "600 12px Manrope, sans-serif"; x.fillStyle = "#5b6373"; x.textAlign = "center";
    x.fillText("zatím žádná data", W / 2, H / 2); x.textAlign = "left";
    return;
  }
  const vals = pts.map((p) => p.v);
  let min = fixMin != null ? fixMin : Math.min(...vals), max = fixMax != null ? fixMax : Math.max(...vals);
  if (min === max) { min -= 5; max += 5; }
  const X = (i) => pad + (i / Math.max(1, pts.length - 1)) * (W - pad * 2);
  const Y = (v) => H - pad - ((v - min) / (max - min)) * (H - pad * 2);
  x.strokeStyle = "rgba(255,255,255,.08)"; x.lineWidth = 1;
  x.font = "600 10px Manrope, sans-serif"; x.fillStyle = "#5b6373";
  for (let g = 0; g <= 2; g++) {
    const v = min + ((max - min) * g) / 2, yy = Y(v);
    x.beginPath(); x.moveTo(pad, yy); x.lineTo(W - pad, yy); x.stroke();
    x.fillText(fmtW(Math.round(v * 10) / 10) + " " + unit, 2, yy + 3);
  }
  const rgb = colors[1].replace("#", "").match(/../g).map((v) => parseInt(v, 16)).join(",");
  const fill = x.createLinearGradient(0, 0, 0, H);
  fill.addColorStop(0, `rgba(${rgb},.22)`); fill.addColorStop(1, `rgba(${rgb},0)`);
  x.beginPath();
  pts.forEach((p, i) => (i ? x.lineTo(X(i), Y(p.v)) : x.moveTo(X(i), Y(p.v))));
  x.lineTo(X(pts.length - 1), H - pad); x.lineTo(X(0), H - pad); x.closePath();
  x.fillStyle = fill; x.fill();
  const grad = x.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
  x.strokeStyle = grad; x.lineWidth = 2.5; x.lineJoin = "round"; x.beginPath();
  pts.forEach((p, i) => (i ? x.lineTo(X(i), Y(p.v)) : x.moveTo(X(i), Y(p.v))));
  x.stroke();
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;
    x.beginPath(); x.arc(X(i), Y(p.v), isLast ? 4.5 : 3, 0, 7);
    x.fillStyle = isLast ? colors[1] : "rgba(255,255,255,.35)"; x.fill();
    if (isLast) { x.strokeStyle = "#000"; x.lineWidth = 2; x.stroke(); }
  });
}

// ---------- export / import ----------
function exportData() {
  $("#ioArea").innerHTML = `<div class="spacer"></div><textarea class="io" onclick="this.select()">${esc(JSON.stringify({ plan, history, overrides }))}</textarea><div class="muted center">Zkopíruj a ulož jako zálohu</div>`;
}
function importPrompt() {
  $("#ioArea").innerHTML = `<div class="spacer"></div><textarea class="io" id="importBox" placeholder="Vlož JSON zálohy"></textarea>
    <button class="btn btn-2" style="margin-top:8px" onclick="doImport()">Naimportovat</button>`;
}
function doImport() {
  try {
    const d = JSON.parse($("#importBox").value);
    if (d.plan) { plan = d.plan; DB.set("plan", plan); } else if (d.workouts) { plan = d; DB.set("plan", plan); }
    if (d.history) { history = d.history; DB.set("history", history); }
    if (d.overrides) { overrides = d.overrides; DB.set("overrides", overrides); }
    applyOverrides(); alert("Import OK"); render();
  } catch (e) { alert("Nevalidní JSON: " + e.message); }
}

// intro: netopýr se přiblíží, až se v něm otevře appka – jen na úvodní obrazovce
function playIntro() {
  const el = document.getElementById("intro");
  if (!el || session || box) return;
  el.innerHTML = `<div class="intro-bat">${I.bat()}</div>`;
  el.hidden = false;
  el.classList.add("run");
  setTimeout(() => { el.hidden = true; el.classList.remove("run"); el.innerHTML = ""; }, 1500);
}

// ---------- init ----------
window.addEventListener("load", () => {
  const unlock = () => beep(1, 0.01, 0.001);
  document.addEventListener("touchstart", unlock, { once: true });
  document.addEventListener("click", unlock, { once: true });
  SpotifyUI.init();
  if (session) keepAwake(true);
  render();
  playIntro();
  // sync kód v odkazu napojí zařízení sám; jinak dotáhni, co je v cloudu
  Sync.fromLink().then((joined) => {
    if (joined) return render();
    if (!Sync.enabled()) return;
    Sync.pull(true).then(() => {
      // minule se nestihlo uložit (výpadek signálu) → dorovnej to teď
      if (localStorage.getItem("sync_dirty") === "1") Sync.push(true);
    });
  });
});
// při návratu do appky si stáhni, co mezitím nahrálo druhé zařízení
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Sync.enabled() && !session) Sync.pull(true);
});

</script>
